name: Temporary Next.js security verification
on:
  push:
    branches:
      - security/nextjs-16-4-1-oct2026
permissions:
  contents: write
jobs:
  update-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Generate npm lockfile without running scripts
        run: npm install --package-lock-only --ignore-scripts --no-audit --no-fund
      - name: Commit regenerated lockfile
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package-lock.json
          if ! git diff --cached --quiet; then
            git commit -m "chore(lock): regenerate lockfile for patched Next.js"
            git push
          fi
      - name: Validate clean dependency installation
        run: npm ci --no-audit --no-fund
      - name: Check installed patched framework
        run: npm ls next --depth=0
      - name: Build
        run: npm run build
